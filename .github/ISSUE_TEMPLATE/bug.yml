# FLOW-PRODUCED: temporary; written under .lad/plans/20261113-0238-go-rewrite.md section 10, C-2. Remove when the cutover PR merges.
name: Bug report
description: Something shortcut does wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: shortcut --version
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed it
      description: The install.sh command you ran, or how you built it
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and shell
      placeholder: Fedora 44, bash 5.2
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command and its output
      description: What you ran and everything it printed. Leave out anything private in your shortcuts.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
