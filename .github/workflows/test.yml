name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the installer
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh
          "$HOME/.local/bin/shortcut" --version
          "$HOME/.local/bin/shortcut" new hi -- 'echo hi "$1"'
          test "$("$HOME/.local/bin/shortcut" r hi there)" = "hi there"
      - name: Smoke-test the package
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
          "$RUNNER_TEMP/venv/bin/shortcut" --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the checkers
        run: python -m pip install ruff==0.16.3 mypy==1.15.0
      - name: ruff
        run: ruff check --select F,E9 .
      - name: mypy
        run: mypy --python-version 3.10 src/shortcut
      - name: bash -n
        run: |
          for f in install.sh templates/scripts/*.sh examples/podman/scripts/podman/*.sh; do bash -n "$f"; done
          python src completion bash > "$RUNNER_TEMP/completion.bash"
          bash -n "$RUNNER_TEMP/completion.bash"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files need formatting:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: ported.sh --strict
        run: sh internal/testkit/ported.sh --strict
      - name: cross-build linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
      - name: cross-build darwin/amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
