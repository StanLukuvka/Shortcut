name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the installer
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh
          "$HOME/.local/bin/shortcut" --version
          "$HOME/.local/bin/shortcut" new hi -- 'echo hi "$1"'
          test "$("$HOME/.local/bin/shortcut" r hi there)" = "hi there"
      - name: Smoke-test the package
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
          "$RUNNER_TEMP/venv/bin/shortcut" --version
