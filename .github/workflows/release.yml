name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zipapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build the zipapp install.sh builds
        run: |
          mkdir -p "$RUNNER_TEMP/app/shortcut"
          cp src/__main__.py "$RUNNER_TEMP/app/"
          cp src/shortcut/*.py "$RUNNER_TEMP/app/shortcut/"
          python -m zipapp "$RUNNER_TEMP/app" -p "/usr/bin/env python3" -o "$RUNNER_TEMP/shortcut"
          chmod +x "$RUNNER_TEMP/shortcut"
          "$RUNNER_TEMP/shortcut" --version
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/shortcut"
