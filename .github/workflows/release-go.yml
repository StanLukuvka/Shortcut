name: release-go
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:                      # nothing is built or uploaded from a red tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: go vet ./... && go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,  goarch: amd64}
          - {goos: linux,  goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage
          go build -trimpath -ldflags "-s -w" -o dist/stage/shortcut ./cmd/shortcut
          cp LICENSE dist/stage/
          tar -C dist/stage -czf "dist/shortcut_${VERSION}_${GOOS}_${GOARCH}.tar.gz" shortcut LICENSE
      - name: "Version matches the tag (linux/amd64 only: the others can't run here)"
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          test "$(dist/stage/shortcut --version)" = "shortcut ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with: {name: "bin-${{ matrix.goos }}-${{ matrix.goarch }}", path: "dist/*.tar.gz"}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "bin-*", path: dist, merge-multiple: true}
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz > checksums.txt && cd ..
          cp installer/install.sh dist/install.sh
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/VERSION   # what releases/latest/download/VERSION serves the installer
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          v="${GITHUB_REF_NAME#v}"; base="${v%%-*}"          # v0.1.0-rc.1 -> 0.1.0: an rc uses the base version's notes
          awk -v v="$base" '$0 ~ "^## \\[?"v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes="--notes-file notes.md"; else notes="--generate-notes"; fi   # no entry yet (the CHANGELOG has only Unreleased until the C-3 release commit): generated notes
          gh release create "$GITHUB_REF_NAME" $prerelease $notes --verify-tag --title "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/checksums.txt dist/install.sh dist/VERSION
