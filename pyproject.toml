[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcut"
dynamic = ["version"]
description = "Save scripts and one-liners as named shortcuts you can run from anywhere."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/StanLukuvka/Shortcut"

[project.scripts]
shortcut = "shortcut:main"

[tool.setuptools]
py-modules = ["shortcut"]

[tool.setuptools.dynamic]
version = { attr = "shortcut.VERSION" }
